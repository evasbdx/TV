name: Build FongMi TV Leanback 32bit
on:
  workflow_dispatch: # ✅ 手动触发，点一下就编译
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile leanback armeabi-v7a（32位电视版）
        run: ./gradlew :app:assembleLeanbackArmeabi_v7aRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-32bit-leanback
          path: app/build/outputs/apk/leanbackArmeabi_v7a/release/app-leanback-armeabi_v7a-release.apk
